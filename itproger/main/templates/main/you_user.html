{% extends 'main/data_view.html' %}

{% block content %}
<div class="main-form">
    <h2>📝 Запит ролі від імені користувача</h2>
    <p style="color: #666; font-size: 14px; margin-bottom: 25px; text-align: left;">Оберіть співробітника для перегляду профілю та створення офіційного запиту.</p>

    <div class="filters-container" style="border: none; padding: 0; margin-bottom: 25px; display: flex; align-items: flex-end; gap: 15px; text-align: left;">
        <div class="filter-group" style="flex-grow: 1; display: flex; flex-direction: column; gap: 5px;">
            <label for="user-id-select" style="font-weight: bold; font-size: 14px;">Виберіть користувача (ID):</label>
            <select id="user-id-select" onchange="loadUserInfo(this.value)" style="width: 100%; height: 40px; padding: 5px 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; background: white; color: #333;">
                <option value="">-- Оберіть зі списку --</option>
                {% for user in all_users %}
                <option value="{{ user.id_user }}" 
                        data-pib="{{ user.prizvische }} {{ user.name }} {{ user.father_name }}"
                        data-pos="{{ user.id_pos__name_pos }}">
                    ID: {{ user.id_user }} | {{ user.prizvische }} {{ user.name|slice:":1" }}.
                </option>
                {% endfor %}
            </select>
        </div>
    
        <button class="add-button" onclick="requestRole()" style="background-color: #3f51b5; height: 40px; border-radius: 4px;">
            🚀 Запросити роль
        </button>
    </div>
    
    <hr style="border: 0; height: 1px; background: #e0e0e0; margin: 25px 0;">

    <div id="user-info-block" class="selection-form-block" style="display: none; background: #f9f9f9; border: 1px solid #ddd; text-align: left;">
        <h3 style="margin-top: 0;">Інформація про профіль: <span id="display-pib" style="color: #3f51b5;"></span></h3>
        <p style="font-size: 15px;"><strong>Посада:</strong> <span id="user-position" style="background: #e8eaf6; color: #1a237e; padding: 3px 8px; border-radius: 4px; font-weight: bold; font-size: 13px;"></span></p>
        
        <table class="roles-table">
            <thead>
                <tr>
                    <th style="width: 40%;">Додаток</th>
                    <th style="width: 60%;">Поточні Ролі</th>
                </tr>
            </thead>
            <tbody id="user-roles-display"></tbody>
        </table>
    </div>
</div>

<div id="request-modal" class="management-block" style="display: none; position: fixed; top: 20%; left: 50%; transform: translateX(-50%); width: 500px; z-index: 1000; box-shadow: 0 5px 25px rgba(0,0,0,0.25); border: 1px solid #3f51b5; background: white;">
    <h3 style="color: #3f51b5; margin-top: 0; border-bottom: 2px solid #3f51b5; padding-bottom: 8px;">Створення офіційного запиту</h3>
    <p style="text-align: left; font-size: 14.5px;"><strong>Від:</strong> <span id="request-user-pib" style="font-weight: bold;"></span></p>
    
    <form id="role-request-form" onsubmit="event.preventDefault(); submitRoleRequest();">
        <div class="filter-group" style="margin-bottom: 20px; text-align: left;">
            <label for="role-reason" style="font-weight: bold; display: block; margin-bottom: 6px; font-size: 14px;">Текст обґрунтування:</label>
            <textarea id="role-reason" name="role-reason" rows="5" style="width: 100%; padding: 10px; border-radius: 4px; border: 1px solid #ccc; font-family: sans-serif; box-sizing: border-box; font-size: 14px; background: white; color: #333;"></textarea>
        </div>
        
        <div class="action-buttons-group" style="display: flex; gap: 10px; justify-content: flex-end;">
            <button type="submit" class="approve-button" style="background-color: #2e7d32; color: white; border: none; padding: 10px 20px; border-radius: 4px; font-weight: bold; cursor: pointer;">✅ Надіслати до ХАЕС</button>
            <button type="button" class="cancel-button" onclick="closeModal()" style="background-color: #6c757d; color: white; border: none; padding: 10px 20px; border-radius: 4px; font-weight: bold; cursor: pointer;">✖️ Скасувати</button>
        </div>
    </form>
</div>

<script id="user-roles-data" type="application/json">
    {{ user_roles_json|safe }}
</script>

<script>
    const USER_ROLES_MAP = JSON.parse(document.getElementById('user-roles-data').textContent);
    
    const userInfoBlock = document.getElementById('user-info-block');
    const userPosition = document.getElementById('user-position');
    const displayPib = document.getElementById('display-pib');
    const userRolesDisplay = document.getElementById('user-roles-display');
    const requestModal = document.getElementById('request-modal');
    const requestUserPib = document.getElementById('request-user-pib');
    const roleReasonArea = document.getElementById('role-reason');
    const userIdSelect = document.getElementById('user-id-select');
    
    let currentUserId = null;

    function loadUserInfo(userId) {
        if (!userId) {
            userInfoBlock.style.display = 'none';
            currentUserId = null;
            return;
        }
        
        currentUserId = userId;
        const selectedOption = userIdSelect.options[userIdSelect.selectedIndex];
        const pib = selectedOption.getAttribute('data-pib');
        const pos = selectedOption.getAttribute('data-pos');

        displayPib.textContent = pib;
        userPosition.textContent = pos;
        requestUserPib.textContent = pib;
        
        roleReasonArea.value = `Я, ${pib}, що займаю посаду "${pos}", прошу надати мені додаткові права доступу для роботи в інформаційних системах ХАЕС.`;

        const roles = USER_ROLES_MAP[userId] || [];
        
        if (roles.length > 0) {
            userRolesDisplay.innerHTML = roles.map(r => `
                <tr>
                    <td><strong>${r.app}</strong></td>
                    <td style="color: #2e7d32; font-weight: 500;">${r.role}</td>
                </tr>
            `).join('');
        } else {
            userRolesDisplay.innerHTML = '<tr><td colspan="2" style="text-align:center; color:#999; padding: 15px;">У даного користувача поки немає призначених ролей.</td></tr>';
        }

        userInfoBlock.style.display = 'block';
    }

    function requestRole() {
        if (!currentUserId) {
            alert('Будь ласка, спочатку оберіть користувача зі списку.');
            return;
        }
        requestModal.style.display = 'block';
    }

    function closeModal() {
        requestModal.style.display = 'none';
    }

    function submitRoleRequest() {
        alert(`✅ Запит успішно згенеровано!\nКористувач: ${displayPib.textContent}\nСистема: STUDERK\nДані збережено в БД.`);
        closeModal();
    }
</script>
{% endblock %}
